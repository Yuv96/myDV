name: 问题与建议
description: 反馈抖音抬头版的问题或改进建议
title: "[反馈] "
body:
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 电视型号与 Android 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤或建议
      description: 请说明实际表现与期望表现；请勿提交 Cookie、Token 或个人消息。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或脱敏日志（可选）
