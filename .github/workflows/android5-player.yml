name: 抖音抬头版 · Android 5.0 build and test
on:
  workflow_dispatch:
  push:
    paths: ['android5/**', '.github/workflows/android5-player.yml']
permissions:
  contents: read
concurrency:
  group: android5-player
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android tools and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID5_KEYSTORE_BASE64 }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android5.p12"
            echo "ANDROID5_KEYSTORE=$RUNNER_TEMP/android5.p12" >> "$GITHUB_ENV"
          fi
      - name: Compile API-21 regression build
        run: SELF_TEST=1 python3 android5/build.py
      - name: Verify manifest and packaged architectures
        run: |
          mkdir -p evidence
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist-test/*.apk > evidence/apk-info.txt
          grep "sdkVersion:'21'" evidence/apk-info.txt
          grep "native-code:.*armeabi-v7a.*x86" evidence/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 dist-test/*.apk > evidence/signature.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android5/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android5-player-evidence
          path: evidence/
      - name: Build production APK without test pages or fixtures
        run: python3 android5/build.py
      - name: Verify production package
        run: python3 android5/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: android5-player-apk
          path: dist/
