name: Douyin debug tools

on:
  push:
    branches: [main, 'debug/**']
    paths:
      - 'tools/**'
      - '.github/workflows/douyin-debug.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/douyin-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated fixture tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tools/tests -p 'test_*.py' -v
